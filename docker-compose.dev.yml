version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: img_redis_dev
    ports:
      - "6379:6379"
    networks:
      - dev_net

  image-service:
    build:
      context: ./services/image-service
      dockerfile: Dockerfile.dev
    container_name: img_api_dev
    ports:
      - "8000:8000"
    env_file:
      - ./services/image-service/.env
    volumes:
      - ./services/image-service/app:/app/app  # Mount app directory
      - /app/__pycache__  # Exclude cache
    depends_on:
      - redis
    networks:
      - dev_net
    # ✅ Correct module path: app.main:app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug

networks:
  dev_net:
    driver: bridge