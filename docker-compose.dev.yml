# ============================================================================
# FILE: docker-compose.dev.yml (ROOT)
# PURPOSE: Development environment with hot-reload
# ============================================================================

version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: zemrev_redis_dev
    ports:
      - "6379:6379"
    networks:
      - zemrev_dev
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  api:
    build:
      context: ./services/image-service
      dockerfile: Dockerfile.dev
    container_name: zemrev_api_dev
    ports:
      - "8000:8000"
    env_file:
      - ./services/image-service/.env
    volumes:
      # Mount source code for hot-reload
      - ./services/image-service/app:/app/app:ro
    depends_on:
      - redis
    networks:
      - zemrev_dev

networks:
  zemrev_dev:
    driver: bridge