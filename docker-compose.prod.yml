# ============================================================================
# FILE: docker-compose.prod.yml
# PURPOSE: Production - Single VM deployment
# ============================================================================

version: '3.9'

services:
  # ==========================================================================
  # SHARED REDIS QUEUE
  # ==========================================================================
  
  redis-queue:
    image: redis:7-alpine
    container_name: zemrev_redis_prod
    restart: unless-stopped
    command: |
      redis-server
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "6379:6379"
    networks:
      - zemrev_prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1.5G

  # ==========================================================================
  # API GATEWAY
  # ==========================================================================
  
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: zemrev_gateway_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - image-service
    networks:
      - zemrev_prod
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ==========================================================================
  # IMAGE SERVICE
  # ==========================================================================
  
  image-service:
    build:
      context: .
      dockerfile: services/image-service/Dockerfile
    container_name: zemrev_image_prod
    restart: unless-stopped
    # No port mapping - only accessible via gateway
    expose:
      - "8000"
    env_file:
      - ./services/image-service/.env.production
    depends_on:
      redis-queue:
        condition: service_healthy
    networks:
      - zemrev_prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

