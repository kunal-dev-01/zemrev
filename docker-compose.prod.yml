# docker-compose.prod.yml

version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: img_redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly no
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - converter_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  image-service:
    build:
      context: ./services/image-service
      dockerfile: Dockerfile
    container_name: img_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./services/image-service/.env.production
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - converter_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

volumes:
  redis_data:

networks:
  converter_net:
    driver: bridge