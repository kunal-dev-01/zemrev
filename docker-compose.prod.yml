# ============================================================================
# FILE: docker-compose.prod.yml (ROOT)
# PURPOSE: Production deployment with optimizations
# ============================================================================

version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: zemrev_redis_prod
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly no
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - zemrev_prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  api:
    build:
      context: ./services/image-service
      dockerfile: Dockerfile
    container_name: zemrev_api_prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./services/image-service/.env.production
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - zemrev_prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

volumes:
  redis_data:
    driver: local

networks:
  zemrev_prod:
    driver: bridge