  #     - ./services/pdf-service/.env.production
  #   environment:
  #     - REDIS_URL=redis://queue:6379
  #     - QUEUE_NAME=zemrev_pdf_jobs
  #   depends_on:
  #     - queue
  #   networks:
  #     - zemrev_prod
  #   deploy:
  #     replicas: 2

volumes:
  redis_data:
    driver: local

networks:
  zemrev_prod:
    driver: bridge