# ============================================================================
# FILE: docker-compose.prod.yml
# PURPOSE: Production - Can scale horizontally
# ============================================================================

version: '3.9'

services:
  # ==========================================================================
  # SHARED QUEUE (Redis with persistence)
  # ==========================================================================
  
  queue:
    image: redis:7-alpine
    container_name: zemrev_queue_prod
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - zemrev_prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ==========================================================================
  # API GATEWAY (Nginx)
  # ==========================================================================
  
  gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: zemrev_gateway_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"  # HTTPS (add SSL config later)
    depends_on:
      - image-service
    networks:
      - zemrev_prod
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ==========================================================================
  # IMAGE SERVICE (Can scale with replicas)
  # ==========================================================================
  
  image-service:
    build:
      context: ./services/image-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./services/image-service/.env.production
    environment:
      - REDIS_URL=redis://queue:6379
      - QUEUE_NAME=zemrev_image_jobs
      - LOG_LEVEL=info
    depends_on:
      queue:
        condition: service_healthy
    networks:
      - zemrev_prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 2  # Scale to 2 instances
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ==========================================================================
  # PDF SERVICE (Future)
  # ==========================================================================
  
  # pdf-service:
  #   build:
  #     context: ./services/pdf-service
