# ============================================================================
# FILE: docker-compose.all.yml
# PURPOSE: All services together (local development)
# ============================================================================

version: '3.9'

services:
  # ==========================================================================
  # SHARED REDIS QUEUE
  # ==========================================================================
  
  redis-queue:
    image: redis:7-alpine
    container_name: zemrev_redis_dev
    ports:
      - "6379:6379"
    command: |
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    networks:
      - zemrev_dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ==========================================================================
  # API GATEWAY
  # ==========================================================================
  
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: zemrev_gateway_dev
    ports:
      - "80:80"
    depends_on:
      - image-service
    networks:
      - zemrev_dev
    restart: unless-stopped

  # ==========================================================================
  # IMAGE SERVICE
  # ==========================================================================
  
  image-service:
    build:
      context: ./services/image-service
      dockerfile: Dockerfile.dev
    container_name: zemrev_image_dev
    ports:
      - "8000:8000"
    env_file:
      - ./services/image-service/.env
    environment:
      - REDIS_URL=redis://redis-queue:6379
      - QUEUE_NAME=zemrev_image_jobs
      - QUEUE_MAX_WORKERS=2
      - LOG_LEVEL=debug
    volumes:
      # Hot-reload
      - ./services/image-service/app:/app/app:ro
    depends_on:
      redis-queue:
        condition: service_healthy
    networks:
      - zemrev_dev

networks:
  zemrev_dev:
    driver: bridge