# ============================================================================
# FILE: docker-compose.ocr.dev.yml (Root Directory)
# PURPOSE: OCR Service - Separate VM Development
# ============================================================================

version: '3.9'

services:
  # ==========================================================================
  # OCR REDIS (Separate - Local only)
  # ==========================================================================
  
  redis-ocr:
    image: redis:7-alpine
    container_name: zemrev_redis_ocr_dev
    expose:
      - "6379"
    command: |
      redis-server
      --bind 127.0.0.1
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    networks:
      - zemrev_ocr_dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ==========================================================================
  # OCR SERVICE
  # ==========================================================================
  
  ocr-service:
    build:
      context: .
      dockerfile: services/ocr-service/Dockerfile.dev
    container_name: zemrev_ocr_dev
    ports:
      - "8004:8004"
    env_file:
      - ./services/ocr-service/.env
    environment:
      - REDIS_URL=redis://redis-ocr:6379
      - QUEUE_NAME=zemrev_ocr_jobs_dev
      - QUEUE_MAX_WORKERS=1
      - LOG_LEVEL=debug
    volumes:
      - ./services/ocr-service/app:/app/app:ro
    depends_on:
      redis-ocr:
        condition: service_healthy
    networks:
      - zemrev_ocr_dev

networks:
  zemrev_ocr_dev:
    driver: bridge