# ============================================================================
# FILE: services/api-gateway/nginx.conf
# PURPOSE: API Gateway - Routes to all 4 microservices
# ============================================================================

user nginxuser;
worker_processes auto;

pid /tmp/nginx.pid;


events {
    worker_connections 1024;
}

http {
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Timeouts for large files
    client_max_body_size 150M;
    client_body_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # ========================================================================
    # UPSTREAM SERVICES
    # ========================================================================
    
    # Image Service (PyVIPS) - Port 8000
    upstream image_service {
        server image-service:8000;
    }

    # Ghostscript Service - Port 8001
    upstream ghostscript_service {
        server ghostscript-service:8001;
    }

    # PyMuPDF Service - Port 8002
    upstream pymupdf_service {
        server pymupdf-service:8002;
    }

    # PyPDF Service - Port 8003
    upstream pypdf_service {
        server pypdf-service:8003;
    }

    # OCR Service - Port 8004 (Separate VM - Comment if not running)
    # upstream ocr_service {
    #     server ocr-service:8004;
    # }

    # ========================================================================
    # MAIN SERVER
    # ========================================================================
    
    server {


        # ========================
        # CORS CONFIG
        # ========================
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        # Preflight requests
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            return 204;
        }

        listen 80;
        server_name _;

        # ====================================================================
        # HEALTH CHECK
        # ====================================================================
        
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ====================================================================
        # IMAGE SERVICE ROUTES (PyVIPS) - /api/v1/image/
        # ====================================================================
        
        location /api/v1/image/ {
            proxy_pass http://image_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ====================================================================
        # GHOSTSCRIPT SERVICE ROUTES - /api/v1/ghostscript/
        # ====================================================================
        
        location /api/v1/ghostscript/ {
            proxy_pass http://ghostscript_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ====================================================================
        # PYMUPDF SERVICE ROUTES - /api/v1/pymupdf/
        # ====================================================================
        
        location /api/v1/pymupdf/ {
            proxy_pass http://pymupdf_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ====================================================================
        # PYPDF SERVICE ROUTES - /api/v1/pypdf/
        # ====================================================================
        
        location /api/v1/pypdf/ {
            proxy_pass http://pypdf_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ====================================================================
        # OCR SERVICE ROUTES - /api/v1/ocr/ (Disabled - Separate VM)
        # ====================================================================
        
        # location /api/v1/ocr/ {
        #     proxy_pass http://ocr_service/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        # ====================================================================
        # ROOT - API INFO
        # ====================================================================
        
        location = / {
            default_type application/json;
            return 200 '{
                "service": "ZEMREV API Gateway",
                "version": "1.0.0",
                "status": "operational",
                "timestamp": "$date_gmt",
                "services": {
                    "image": {
                        "name": "Image Service (PyVIPS)",
                        "route": "/api/v1/image/",
                        "tools": ["convert", "compress", "resize", "optimize", "crop", "watermark", "metadata", "palette"]
                    },
                    "ghostscript": {
                        "name": "Ghostscript Service",
                        "route": "/api/v1/ghostscript/",
                        "tools": ["compress", "flatten", "convert-pdfa"]
                    },
                    "pymupdf": {
                        "name": "PyMuPDF Service",
                        "route": "/api/v1/pymupdf/",
                        "tools": ["pdf-to-images", "images-to-pdf", "extract-text", "extract-images", "sign", "optimize", "crop", "remove-pages"]
                    },
                    "pypdf": {
                        "name": "PyPDF Service",
                        "route": "/api/v1/pypdf/",
                        "tools": ["encrypt", "decrypt", "merge", "split", "rotate"]
                    }
                },
                "health": "/health"
            }';
        }

        # ====================================================================
        # CATCH-ALL - 404
        # ====================================================================
        
        location / {
            return 404;
            default_type application/json;
            return 404 '{"error": "Route not found. Use GET / for available routes"}';
        }
    }
}