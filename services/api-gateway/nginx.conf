# ============================================================================
# FILE: services/api-gateway/nginx.conf
# PURPOSE: API Gateway with Fixed CORS (HTTPS Ready)
# ============================================================================

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # ------------------------------------------------------------------------
    # LOGGING
    # ------------------------------------------------------------------------
    access_log /usr/local/openresty/nginx/logs/access.log;
    error_log  /usr/local/openresty/nginx/logs/error.log;

    # ------------------------------------------------------------------------
    # TIMEOUTS & LIMITS
    # ------------------------------------------------------------------------
    client_max_body_size 150M;
    client_body_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # ------------------------------------------------------------------------
    # LUA PATH (for rate_limit.lua)
    # ------------------------------------------------------------------------
    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";
    
    # Shared dict for connection pooling
    lua_shared_dict rate_limit_cache 10m;

    # ------------------------------------------------------------------------
    # CORS ORIGIN MAPPING (FIXED)
    # ------------------------------------------------------------------------
    map $http_origin $cors_origin {
        default "";
        "http://localhost:3000" $http_origin;
        "https://localhost:3000" $http_origin;
        "https://www.zemrev.com" $http_origin;
        "https://zemrev.com" $http_origin;
    }

    # ------------------------------------------------------------------------
    # UPSTREAM SERVICES
    # ------------------------------------------------------------------------
    upstream image_service {
        server image-service:8000;
    }

    upstream ghostscript_service {
        server ghostscript-service:8001;
    }

    upstream pymupdf_service {
        server pymupdf-service:8002;
    }

    upstream pypdf_service {
        server pypdf-service:8003;
    }

    # ------------------------------------------------------------------------
    # SERVER
    # ------------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name api.zemrev.com;
        return 301 https://$host$request_uri;
        
        ssl_certificate     /etc/nginx/ssl/cf-origin.pem;
        ssl_certificate_key /etc/nginx/ssl/cf-origin.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # -----------------------
        # HEALTH
        # -----------------------
        location /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        # -----------------------
        # IMAGE SERVICE (15 req/min)
        # -----------------------
        location /api/v1/image/ {
            # CORS headers (FIXED)
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept" always;
            add_header Access-Control-Max-Age 3600 always;

            # Handle preflight
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept" always;
                add_header Access-Control-Max-Age 3600 always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            # Rate limiting
            access_by_lua_block {
                local rate_limit = require "rate_limit"
                local identifier = ngx.var.remote_addr
                rate_limit.check("image", identifier)
            }
            
            proxy_pass http://image_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -----------------------
        # GHOSTSCRIPT SERVICE (10 req/min)
        # -----------------------
        location /api/v1/ghostscript/ {
            # CORS headers
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept" always;
            add_header Access-Control-Max-Age 3600 always;

            # Handle preflight
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept" always;
                add_header Access-Control-Max-Age 3600 always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            # Rate limiting
            access_by_lua_block {
                local rate_limit = require "rate_limit"
                local identifier = ngx.var.remote_addr
                rate_limit.check("ghostscript", identifier)
            }
            
            proxy_pass http://ghostscript_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -----------------------
        # PYMUPDF SERVICE (14 req/min)
        # -----------------------
        location /api/v1/pymupdf/ {
            # CORS headers
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept" always;
            add_header Access-Control-Max-Age 3600 always;

            # Handle preflight
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept" always;
                add_header Access-Control-Max-Age 3600 always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            # Rate limiting
            access_by_lua_block {
                local rate_limit = require "rate_limit"
                local identifier = ngx.var.remote_addr
                rate_limit.check("pymupdf", identifier)
            }
            
            proxy_pass http://pymupdf_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -----------------------
        # PYPDF SERVICE (14 req/min)
        # -----------------------
        location /api/v1/pypdf/ {
            # CORS headers
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept" always;
            add_header Access-Control-Max-Age 3600 always;

            # Handle preflight
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept" always;
                add_header Access-Control-Max-Age 3600 always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            # Rate limiting
            access_by_lua_block {
                local rate_limit = require "rate_limit"
                local identifier = ngx.var.remote_addr
                rate_limit.check("pypdf", identifier)
            }
            
            proxy_pass http://pypdf_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -----------------------
        # ROOT
        # -----------------------
        location = / {
            add_header Access-Control-Allow-Origin $cors_origin always;
            default_type application/json;
            return 200 '{
              "service": "ZEMREV API Gateway",
              "status": "operational",
              "health": "/health"
            }';
        }

        # -----------------------
        # 404
        # -----------------------
        location / {
            add_header Access-Control-Allow-Origin $cors_origin always;
            default_type application/json;
            return 404 '{"error":"Route not found"}';
        }
    }
}