# ============================================================================
# FILE: services/api-gateway/nginx.conf
# PURPOSE: API Gateway - Routes to microservices
# ============================================================================

events {
    worker_connections 1024;
}

http {
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Timeouts for large files
    client_max_body_size 100M;
    client_body_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Upstream services
    upstream image_service {
        server image-service:8000;
        # Add more instances for horizontal scaling:
        # server image-service-2:8000;
        # server image-service-3:8000;
    }

    upstream pdf_service {
        server pdf-service:8001;
        # Future scaling:
        # server pdf-service-2:8001;
    }

    # Main server
    server {
        listen 80;
        server_name _;

        # Health check
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ====================================================================
        # IMAGE SERVICE ROUTES
        # ====================================================================
        
        location /api/v1/image/ {
            proxy_pass http://image_service/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # Direct image service access (optional)
        location /image-service/ {
            proxy_pass http://image_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ====================================================================
        # PDF SERVICE ROUTES (Future)
        # ====================================================================
        
        location /api/v1/pdf/ {
            proxy_pass http://pdf_service/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # CORS
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # ====================================================================
        # ROOT - API INFO
        # ====================================================================
        
        location = / {
            default_type application/json;
            return 200 '{
                "service": "ZEMREV API Gateway",
                "version": "1.0.0",
                "status": "operational",
                "services": {
                    "image": "/api/v1/image/",
                    "pdf": "/api/v1/pdf/"
                },
                "health": "/health"
            }';
        }

        # 404 handler
        location / {
            return 404 '{"error": "Route not found"}';
            default_type application/json;
        }
    }
}