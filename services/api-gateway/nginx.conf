# ============================================================================
# FILE: services/api-gateway/nginx.conf
# PURPOSE: API Gateway - Production (CORS FIXED FOR ALL SERVICES)
# ============================================================================

user nginxuser;
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # ------------------------------------------------------------------------
    # LOGGING
    # ------------------------------------------------------------------------
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ------------------------------------------------------------------------
    # TIMEOUTS & LIMITS
    # ------------------------------------------------------------------------
    client_max_body_size 150M;
    client_body_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # ------------------------------------------------------------------------
    # GLOBAL CORS (🔥 SINGLE SOURCE OF TRUTH)
    # ------------------------------------------------------------------------
    map $http_origin $cors_origin {
        default "";
        "~^https?://(localhost:3000|www\.zemrev\.com)$" $http_origin;
    }

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

    # Handle preflight
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ------------------------------------------------------------------------
    # UPSTREAM SERVICES
    # ------------------------------------------------------------------------
    upstream image_service {
        server image-service:8000;
    }

    upstream ghostscript_service {
        server ghostscript-service:8001;
    }

    upstream pymupdf_service {
        server pymupdf-service:8002;
    }

    upstream pypdf_service {
        server pypdf-service:8003;
    }

    # ------------------------------------------------------------------------
    # SERVER
    # ------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # -----------------------
        # HEALTH
        # -----------------------
        location /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        # -----------------------
        # IMAGE SERVICE
        # -----------------------
        location /api/v1/image/ {
            proxy_pass http://image_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -----------------------
        # GHOSTSCRIPT SERVICE
        # -----------------------
        location /api/v1/ghostscript/ {
            proxy_pass http://ghostscript_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -----------------------
        # PYMUPDF SERVICE
        # -----------------------
        location /api/v1/pymupdf/ {
            proxy_pass http://pymupdf_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -----------------------
        # PYPDF SERVICE
        # -----------------------
        location /api/v1/pypdf/ {
            proxy_pass http://pypdf_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -----------------------
        # ROOT
        # -----------------------
        location = / {
            default_type application/json;
            return 200 '{
              "service": "ZEMREV API Gateway",
              "status": "operational",
              "health": "/health"
            }';
        }

        # -----------------------
        # 404
        # -----------------------
        location / {
            default_type application/json;
            return 404 '{"error":"Route not found"}';
        }
    }
}
