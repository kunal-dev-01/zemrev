# ============================================================================
# FILE: services/redis-queue/redis.conf
# PURPOSE: Optimized Redis config for queue processing
# ============================================================================

# Memory
maxmemory 1gb
maxmemory-policy allkeys-lru

# Persistence OFF (no need to save, ephemeral queue)
save ""
appendonly no

# Performance
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Logging
loglevel notice
logfile ""

# Slow log (for debugging)
slowlog-log-slower-than 10000
slowlog-max-len 128

# Max clients
maxclients 10000

# Threading (Redis 6+)
io-threads 4
io-threads-do-reads yes